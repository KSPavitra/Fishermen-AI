<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4" />

  <!-- Radar Waves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="3" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />

  <!-- Stylized Fish Icon with Glow -->
  <g filter="url(#glow)">
    <!-- Body -->
    <path d="M 120 256 C 180 180, 320 180, 390 256 C 320 332, 180 332, 120 256 Z" fill="url(#fishGrad)" />
    <!-- Tail Fin -->
    <path d="M 125 256 L 65 195 C 75 235, 75 277, 65 317 Z" fill="url(#fishGrad)" />
    <!-- Dorsal Fin -->
    <path d="M 230 196 C 265 150, 305 160, 320 205 Z" fill="#0284c7" opacity="0.8" />
    <!-- Ventral Fin -->
    <path d="M 240 316 C 270 355, 300 345, 310 310 Z" fill="#0284c7" opacity="0.8" />
    <!-- Eye -->
    <circle cx="345" cy="242" r="10" fill="#ffffff" />
    <circle cx="347" cy="242" r="5" fill="#030712" />
    <!-- Gill line -->
    <path d="M 300 220 Q 285 256 300 292" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Pulsating Radar Beacons -->
  <circle cx="256" cy="256" r="6" fill="#facc15" />
</svg>
